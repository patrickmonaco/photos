[project]
name = "phototheque"
version = "0.7.4"
description = "Gestionnaire de photos non destructif, compatible Picasa (FR/EN)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pillow>=10.0",
    "defusedxml>=0.7",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "onnx>=1.15", "scikit-image>=0.22"]

[project.scripts]
phototheque = "phototheque.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["phototheque*"]

[tool.setuptools.package-data]
phototheque = ["static/*", "static/i18n/*", "static/vendor/*/*", "static/vendor/*/*/*"]
